<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema de Clasificación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0fff0;
            color: #2f4f2f;
            transition: background-color 0.3s, color 0.3s;
        }
        
        body.oscuro {
            background-color: #121212;
            color: #d0ffd0;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        
        header button {
            position: absolute;
            inset-block-start: 20px;
            inset-inline-end: 20px;
            background-color: white;
            color: #4CAF50;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        header button:hover {
            background-color: #d4ffd4;
            transform: scale(1.05);
        }
        
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            block-size: 70vh;
            padding: 20px;
        }
        
        form {
            background-color: #e8fbe8;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            inline-size: 300px;
        }
        
        h2 {
            text-align: center;
        }
        
        input {
            inline-size: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        button.enviar {
            inline-size: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        button.enviar:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }
        
        .volver {
            display: block;
            text-align: center;
            margin: 20px;
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        
        footer {
            text-align: center;
            background-color: #4CAF50;
            color: white;
            padding: 20px;
        }
        
        .redes-sociales a {
            margin: 0 10px;
            font-size: 24px;
            color: white;
            transition: transform 0.3s, color 0.3s;
        }
        
        .redes-sociales a:hover {
            transform: scale(1.2);
            color: #d0ffd0;
        }
    </style>
</head>

<body>
    <header>
        <h1>Iniciar Sesión</h1>
        <button onclick="activarModoOscuro()">🌓 Modo Oscuro</button>
    </header>

    <main>
        <form>
            <h2>Bienvenido</h2>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="password" placeholder="Contraseña" required>
            <button type="submit" class="enviar">Ingresar</button>
        </form>
    </main>

    <a class="volver" href="../index.html">⬅ Volver al inicio</a>

    <footer>
        <p>Proyecto desarrollado por Juan Sebastián Guzmán, Kevin Daniel Garavito y Yeiner Damián</p>
        <div class="redes-sociales">
            <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
        <p>© 2025 - Institución Educativa República de Uruguay</p>
    </footer>

    <script>
        function activarModoOscuro() {
            document.body.classList.toggle('oscuro');
        }
    </script>
</body>

</html>
