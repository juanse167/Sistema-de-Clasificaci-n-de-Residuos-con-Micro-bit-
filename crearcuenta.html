<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        
        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form onsubmit="return registrarUsuario();">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            <input type="password" id="confirmar" placeholder="Confirmar contraseña" required>
            <button type="submit">Registrar</button>
        </form>
        <p id="mensaje" style="color: red; text-align: center;"></p>
    </div>

    <script>
        function registrarUsuario() {
            const nombre = document.getElementById('nombre').value;
            const usuario = document.getElementById('usuario').value;
            const email = document.getElementById('email').value;
            const contrasena = document.getElementById('contrasena').value;
            const confirmar = document.getElementById('confirmar').value;

            const mensaje = document.getElementById('mensaje');

            if (contrasena !== confirmar) {
                mensaje.textContent = 'Las contraseñas no coinciden.';
                return false;
            }

            // Simula que se guarda el usuario e inicia sesión
            localStorage.setItem('usuarioLogueado', JSON.stringify({
                nombre: nombre,
                usuario: usuario,
                email: email
            }));

            // Redirigir al index.html
            alert('Cuenta creada exitosamente. ¡Bienvenido, ' + nombre + '!');
            window.location.href = 'index.html';
            return false;
        }
    </script>
</body>

</html>
