<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Sistema de Clasificación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: #e6f5e6;
            color: #2d2d2d;
            transition: background-color 0.3s, color 0.3s;
        }
        
        body.oscuro {
            background-color: #121212;
            color: #e0e0e0;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        main {
            max-width: 400px;
            margin: 40px auto;
            background-color: #ffffffc9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        body.oscuro main {
            background-color: #1e1e1e;
        }
        
        h2 {
            text-align: center;
            color: #4CAF50;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-top: 10px;
        }
        
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        body.oscuro input {
            background-color: #2a2a2a;
            color: #f0f0f0;
            border: 1px solid #555;
        }
        
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        button:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }
        
        .volver {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .volver a {
            background-color: #388e3c;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .volver a:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }
        
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
        }
        
        body.oscuro footer {
            background-color: #1b5e20;
        }
        
        .modo-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: white;
            color: #4CAF50;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .modo-btn:hover {
            background-color: #d4ffd4;
        }
        
        #mensaje {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Iniciar Sesión</h1>
        <p>Bienvenido al sistema de clasificación de residuos</p>
        <button class="modo-btn" onclick="activarModoOscuro()">🌓 Modo Oscuro</button>
    </header>

    <main>
        <h2>Accede a tu cuenta</h2>
        <form id="loginForm">
            <label for="username">Correo electrónico</label>
            <input type="text" id="username" placeholder="ejemplo david123" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña" required>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <p id="mensaje"></p>

        <div class="volver">
            <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </main>

    <footer>
        <p>Proyecto desarrollado por Juan Sebastián Guzmán, Kevin Daniel Garavito y Yeiner Damián</p>
        <p>© 2025 - Institución Educativa República de Uruguay</p>
    </footer>

    <script>
        function activarModoOscuro() {
            document.body.classList.toggle('oscuro');
        }

        document.getElementById("loginForm").addEventListener("submit", async(e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("http://localhost/pia2/backend/login.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await res.json();
                document.getElementById("mensaje").innerText = data.message;
                console.log(data);

                if (data.success) {
                    document.getElementById("mensaje").style.color = "green";
                } else {
                    document.getElementById("mensaje").style.color = "red";
                }
            } catch (error) {
                document.getElementById("mensaje").innerText = "Error de conexión con el servidor.";
                document.getElementById("mensaje").style.color = "red";
            }
        });
    </script>
</body>

</html>
