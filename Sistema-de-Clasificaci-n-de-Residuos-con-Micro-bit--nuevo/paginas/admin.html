<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login Proyecto</title>
</head>

<body>
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <label for="username">Usuario:</label><br>
        <input type="text" id="username" required><br><br>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" required><br><br>
        <button type="submit">Ingresar</button>
    </form>

    <p id="mensaje"></p>

    <script>
        // CÓDIGO DIRECTAMENTE EN EL HTML - EVITA PROBLEMAS DE RUTAS
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            try {
                console.log("🔍 Intentando login...");

                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                // RUTA CORRECTA desde paginas/admin.html hacia backend/login.php
                const res = await fetch("http://localhost/pia2/backend/login.php", {
                    method: "POST",
                    body: formData
                });

                console.log(" Respuesta recibida, status:", res.status);

                const data = await res.json();
                console.log(" Datos:", data);

                mensaje.innerText = data.message;
                mensaje.style.color = data.success ? "green" : "red";

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                }
            } catch (error) {
                console.error(" Error:", error);
                mensaje.innerText = "Error de conexión: " + error.message;
                mensaje.style.color = "red";
            }
        });
    </script>
</body>

</html>
