<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer Contraseña</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        h2 {
            color: #4caf50;
            margin-bottom: 1rem;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 2px solid #81c784;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #388e3c;
        }
        
        .message {
            margin-top: 1rem;
            font-weight: 600;
            color: #333;
        }
        
        .error {
            color: #d32f2f;
        }
        
        .success {
            color: #388e3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Restablecer Contraseña</h2>
        <p>Ingresa tu correo electrónico para recibir instrucciones.</p>
        <form id="resetForm">
            <input type="email" id="email" placeholder="correo@ejemplo.com" required />
            <button type="submit">Enviar instrucciones</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');

        resetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = resetForm.email.value.trim();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageDiv.textContent = 'Por favor ingresa un correo electrónico válido.';
                messageDiv.className = 'message error';
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            const usuarioExiste = usuarios.some(u => u.email.toLowerCase() === email.toLowerCase());

            if (!usuarioExiste) {
                messageDiv.textContent = 'No se encontró ninguna cuenta con ese correo.';
                messageDiv.className = 'message error';
                return;
            }

            messageDiv.textContent = 'Si el correo está registrado, recibirás un email con instrucciones.';
            messageDiv.className = 'message success';

            resetForm.reset();
        });
    </script>
</body>

</html>
