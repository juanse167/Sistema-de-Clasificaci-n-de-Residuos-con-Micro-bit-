<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <style>
        /* Reset y base */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #a5d6a7, #e8f5e9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        
        .login-container h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color .3s, box-shadow .3s;
        }
        
        input:focus {
            border-color: #66bb6a;
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.3);
            outline: none;
        }
        
        .password-field {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #888;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .login-button {
            width: 100%;
            padding: 0.75rem;
            background: #2e7d32;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background .3s, transform .1s;
        }
        
        .login-button:hover {
            background: #1b5e20;
        }
        
        .login-button:active {
            transform: scale(0.98);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .form-options a {
            color: #66bb6a;
            text-decoration: none;
        }
        
        .form-options a:hover {
            text-decoration: underline;
        }
        
        .register-link {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        .register-link a {
            color: #388e3c;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main role="main">
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Usuario o correo electrónico</label>
                    <input type="text" id="username" name="username" placeholder="ejemplo@dominio.com" required autocomplete="username">
                    <div class="error-message" id="user-error">Este campo es obligatorio.</div>
                </div>
                <div class="form-group password-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-label="Mostrar contraseña">👁️</button>
                    <div class="error-message" id="pass-error">La contraseña es obligatoria.</div>
                </div>
                <div class="form-options">
                    <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="login-button">Ingresar</button>
            </form>
            <div class="register-link">
                ¿No tienes cuenta? <a href="crear_cuenta.html">Crear una aquí</a>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const user = form.username;
        const pass = form.password;
        const userErr = document.getElementById('user-error');
        const passErr = document.getElementById('pass-error');
        const toggle = document.querySelector('.toggle-password');

        toggle.addEventListener('click', () => {
            const type = pass.getAttribute('type') === 'password' ? 'text' : 'password';
            pass.setAttribute('type', type);
            toggle.textContent = type === 'password' ? '👁️' : '🚫';
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            let valid = true;
            [user, pass].forEach(input => {
                const err = input === user ? userErr : passErr;
                if (!input.value.trim()) {
                    err.style.display = 'block';
                    input.setAttribute('aria-invalid', 'true');
                    valid = false;
                } else {
                    err.style.display = 'none';
                    input.removeAttribute('aria-invalid');
                }
            });
            if (!valid) return;

            const stored = JSON.parse(localStorage.getItem('usuarioLogueado'));
            if (stored && user.value === stored.usuario && pass.value === '1234') {
                window.location.href = 'indexx.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        });
    </script>

</body>

</html>
