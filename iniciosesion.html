<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .login-container {
            background: #a5d6a7;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.2);
            text-align: center;
            width: 350px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #388e3c;
            border-radius: 5px;
        }
        
        button {
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            border: none;
        }
        
        .iniciar {
            background-color: #66bb6a;
            color: #fff;
        }
        
        .crear-cuenta-link {
            display: block;
            margin-top: 15px;
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }
        
        .crear-cuenta-link:hover {
            text-decoration: underline;
        }
        
        .back-button {
            margin-top: 20px;
            text-decoration: none;
            background-color: #66bb6a;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .back-button:hover {
            background-color: #388e3c;
        }
        
        #error-msg {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button class="iniciar" onclick="login()">Ingresar</button>

        <a class="crear-cuenta-link" href="crear_cuenta.html">¿No tienes cuenta? Crear una aquí</a>

        <p id="error-msg"></p>
    </div>

    <a href="indexx.html" class="back-button">← Volver al Inicio</a>

    <script>
        function login() {
            const usuario = document.getElementById('username').value;
            const clave = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));

            if (usuarioGuardado && usuario === usuarioGuardado.usuario && clave === "1234") {
                alert('Inicio de sesión exitoso. ¡Bienvenido, ' + usuarioGuardado.nombre + '!');
                window.location.href = 'indexx.html';
            } else {
                errorMsg.textContent = 'Usuario o contraseña incorrectos.';
            }
        }
    </script>

</body>

</html>
